name: Deploy TC Desk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Sign in to Google (no key file needed)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/836507322815/locations/global/workloadIdentityPools/github/providers/tc-desk-repo
          service_account: github-deploy@tc-desk.iam.gserviceaccount.com
      - name: Deploy to Firebase
        run: npx --yes firebase-tools@latest deploy --only hosting,firestore:rules,firestore:indexes --project tc-desk --non-interactive
