<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TC Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#B3202A;--red-d:#8E1820;--ink:#1d2330;--mut:#667085;--line:#e4e7ec;--bg:#f6f7f9;--gray:#f2f3f5}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.4}
h1{font-size:22px;margin:0 0 4px}
header.top{display:flex;align-items:center;gap:18px;padding:10px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;background:var(--red);border-radius:3px;display:inline-block}
nav.main{display:flex;gap:4px}
nav.main button{border:0;background:none;font:inherit;font-weight:500;color:var(--mut);padding:7px 12px;border-radius:7px;cursor:pointer}
nav.main button.on{background:var(--gray);color:var(--ink)}
.grow{flex:1}
.banner{background:#fffaeb;border-bottom:1px solid #fedf89;color:#93370d;padding:8px 24px;font-size:13px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 24px 64px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:7px;font:inherit;font-weight:500;cursor:pointer;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{background:#fafafa}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red-d)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--mut)}
.btn.ghost:hover{color:var(--ink);background:var(--gray)}
.btn.danger{color:#b42318}
.btn.block{width:100%;justify-content:center;margin-bottom:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.end{justify-content:flex-end}
.mut{color:var(--mut)}
.small{font-size:12px}
.warn{background:#fffaeb;color:#93370d;border:1px solid #fedf89;border-radius:7px;padding:8px 10px;font-size:13px}
.scroll{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;background:#fff}
table.list th{text-align:left;font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:last-child td{border-bottom:0}
table.list tr.click:hover td{background:#fafbfc;cursor:pointer}
td.empty{text-align:center;padding:32px}
.tablecard{padding:0;overflow:hidden}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--gray);color:#475467;white-space:nowrap}
.pill.Active{background:#e8f1fd;color:#1849a9}
.pill.Pending{background:#fef0c7;color:#93370d}
.pill.Closed,.pill.ok{background:#dcfae6;color:#085d3a}
.pill.over{background:#fee4e2;color:#b42318}
.pill.soon{background:#fef0c7;color:#93370d}
.toolbar{display:flex;gap:8px;align-items:center;margin:16px 0;flex-wrap:wrap}
.toolbar input{max-width:280px}
.toolbar select{width:auto}
.layout{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.up h3{margin:0 0 10px;font-size:13px}
.upi{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.upi:first-of-type{border-top:0}
.upi:hover b{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 16px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);font-weight:500}
.wide{grid-column:1/-1}
input,select,textarea{font:inherit;color:var(--ink);border:1px solid #d0d5dd;border-radius:7px;padding:7px 9px;background:#fff;width:100%}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--red);cursor:pointer}
input:focus,select:focus,textarea:focus{outline:2px solid #f6cfd2;border-color:var(--red)}
textarea{resize:vertical;min-height:90px}
.sec{margin-bottom:14px}
.sec h3{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--red)}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:16px 0;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font:inherit;font-weight:500;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--red)}
table.dates input{padding:5px 7px}
tr.struck td .lbl,tr.struck td b{text-decoration:line-through;color:#98a2b3}
.prog{height:6px;background:var(--gray);border-radius:9px;margin:12px 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--red);border-radius:9px;transition:width .2s}
.ck{display:grid;grid-template-columns:20px 1fr 150px 110px 32px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.ck .cktext{border-color:transparent}
.ck .cktext:hover{border-color:#d0d5dd}
.ck.done .cktext{text-decoration:line-through;color:#98a2b3}
.ck input[type=date]{padding:5px 7px}
.addrow{margin-top:12px;display:flex;gap:8px}
.note{margin-top:10px}
.ntext{white-space:pre-wrap;margin-top:6px}
.split{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start}
.side{padding:8px}
.li{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--ink)}
.li:hover{background:var(--gray)}
.li.on{background:#fbe9ea;color:var(--red-d);font-weight:600}
.emrow{display:grid;grid-template-columns:70px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.emrow span{color:var(--mut);font-size:12px;font-weight:500;padding-top:2px}
.embody{white-space:pre-wrap;font-family:inherit;font-size:14px;margin:12px 0;padding:12px;background:var(--gray);border-radius:7px;max-height:460px;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;max-height:150px;overflow:auto;padding:8px;background:var(--gray);border-radius:7px}
.chip{border:1px solid var(--line);background:#fff;border-radius:5px;font-size:11px;padding:2px 6px;cursor:pointer;font-family:ui-monospace,Menlo,monospace;color:#344054}
.chip:hover{border-color:var(--red);color:var(--red)}
.ed{display:flex;flex-direction:column;gap:12px}
.hint{font-size:12px;color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:center;justify-content:center;z-index:20}
.mbox{background:#fff;border-radius:12px;padding:20px;max-width:400px;width:90%}
.hidden{display:none!important}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2330;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:30}
.ph{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.ph:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;color:#344054;display:inline-flex;align-items:center;gap:6px}
.fchip .dot{width:8px;height:8px;border-radius:50%}
.fchip b{font-weight:600;color:var(--mut)}
.fchip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.fchip.on b{color:#d0d5dd}
td.stripe{border-left:4px solid transparent}
.stepper{display:flex;gap:4px;margin-top:14px;flex-wrap:wrap;align-items:center}
.step{flex:1;min-width:110px;border:0;border-radius:6px;padding:8px 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;background:var(--gray);color:#98a2b3;text-align:center}
.step.past{color:#475467}
.side-steps{display:flex;gap:4px;margin-left:8px}
.linkbtn{border:0;background:none;color:var(--red);font:inherit;font-weight:500;cursor:pointer;padding:0;text-decoration:underline}
.cform{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cards{display:flex;flex-direction:column;gap:8px}
.tcard{border-radius:6px;padding:8px 12px 7px;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tcard.click{cursor:pointer}
.tcard.click:hover{filter:brightness(1.06)}
.tcard .own{font-size:11px;font-style:italic;opacity:.9;border-bottom:1px solid currentColor;padding-bottom:2px;margin-bottom:3px}
.tcard .tr{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tcard .tr b{font-weight:700;font-size:14px}
.tcard .ttl{font-weight:700;font-size:14px}
.bar2{position:relative;height:15px;background:#111;margin:4px 0 3px;border:1px solid rgba(0,0,0,.4);overflow:hidden}
.bar2 i{position:absolute;inset:0 auto 0 0;background:currentColor;opacity:.55}
.bar2 span{position:absolute;right:6px;top:0;font-size:11px;font-weight:600;color:#fff;line-height:14px;text-shadow:0 0 2px #000}
.tcard .foot{display:flex;justify-content:space-between;font-size:12px;gap:8px}
.tcard .foot i{font-style:italic}
.phchip{border:0;border-radius:4px;padding:5px 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;gap:5px;align-items:center;min-width:60px;justify-content:center}
.phchip.off{opacity:.3}
.phbox{padding:10px 12px;margin-bottom:12px}
.filt h4{margin:12px 0 4px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.filt h4:first-child{margin-top:0}
.filt label{display:flex;align-items:center;gap:6px;font-size:13px;padding:2px 0;cursor:pointer}
.filt label input{width:14px;height:14px}
.filt label b{margin-left:auto;font-weight:500;color:var(--mut);font-size:12px}
.sidecol{display:flex;flex-direction:column;gap:12px}
.cnt{display:inline-block;background:var(--ink);color:#fff;border-radius:6px;font-size:14px;padding:1px 8px;vertical-align:middle}
.phbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.phbar label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mut)}
.phbar select{width:auto;min-width:150px}
.ck{grid-template-columns:20px minmax(160px,1fr) 105px 160px 56px 100px 96px 28px 28px!important}
.ck .span2{grid-column:span 2}
.ck select{padding:5px 6px;font-size:13px}
.ck input[data-ckf=days]{padding:5px 6px;text-align:center}
.dd{font-size:13px;font-weight:600;white-space:nowrap}
.ckhead{display:grid;grid-template-columns:20px minmax(160px,1fr) 105px 160px 56px 100px 96px 28px 28px;gap:8px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:600;padding:6px 0}
.ms{font-size:15px;color:#d0d5dd}
.ms.on{color:#f59e0b}
.badge{font-size:11px;font-weight:600;border-radius:5px;padding:2px 7px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--mut)}
.badge.key.on{background:#fef0c7;border-color:#fedf89;color:#93370d}
.badge.pub.on{background:#dcfae6;border-color:#abefc6;color:#085d3a}
.note.keyn{border-left:4px solid #f59e0b}
.subtabs{display:flex;gap:4px;margin:4px 0 14px}
.phprev{display:inline-block;padding:3px 10px;border-radius:4px;font-size:12px;font-weight:600;min-width:90px;text-align:center}
input[type=color]{width:44px;height:30px;padding:2px;cursor:pointer}
.rv{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:7px;margin-bottom:6px;font-size:13px}
.rv.bad{background:#fef3f2;color:#912018}.rv.warn{background:#fffaeb;color:#93370d}.rv.ok{background:#ecfdf3;color:#085d3a}
.rv span:nth-child(2){flex:1}.rvi{font-weight:700;width:14px;text-align:center}
.flash{animation:fl 1.6s}@keyframes fl{0%,60%{box-shadow:0 0 0 3px #fda29b}100%{box-shadow:none}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}.seg button{border:0;background:#fff;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer;color:var(--mut)}.seg button.on{background:var(--ink);color:#fff}
.tkg{margin-top:10px}.tkgh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:12px 0 6px}.tkgh span{background:var(--gray);border-radius:99px;padding:1px 7px;margin-left:4px}.tkgh.over{color:#b42318}
.tk{border:1px solid var(--line);border-radius:9px;background:#fff;margin-bottom:6px}.tk.sub{border-radius:7px;margin:6px 0 0}
.tkh{display:flex;align-items:center;gap:8px;padding:8px 10px;flex-wrap:wrap}.tkt{flex:1;min-width:180px;text-align:left;border:0;background:none;font:inherit;font-weight:500;cursor:pointer;padding:2px 0;color:var(--ink)}
.tk.done>.tkh .tkt{text-decoration:line-through;color:#98a2b3}.tkd{font-size:12px;color:var(--mut);white-space:nowrap}
.chipw{font-size:11px;font-weight:600;background:#eef4ff;color:#3538cd;border-radius:99px;padding:2px 8px}
.kids{border:1px solid var(--line);background:var(--gray);border-radius:6px;font:inherit;font-size:12px;padding:2px 8px;cursor:pointer;color:#344054}
.tke{padding:4px 10px 10px 34px;display:flex;flex-direction:column;gap:8px}.tke .row select,.tke .row input{padding:5px 7px;font-size:13px}
.tkk{padding:0 10px 10px 30px;border-top:1px dashed var(--line)}
.plook{position:absolute;top:100%;left:0;right:0;z-index:15;background:#fff;border:1px solid #d0d5dd;border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.12);margin-top:2px;max-height:300px;overflow:auto}
.pli{padding:7px 10px;cursor:pointer;color:var(--ink);font-weight:400}.pli b{font-weight:600}.pli.on,.pli:hover{background:#fbe9ea}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.pc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}.pc.empty{background:#fcfcfd}
.pch{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}.req{color:#b42318}
.pname{border:0;background:none;padding:0;font:inherit;font-weight:600;font-style:italic;color:#1d4ed8;cursor:pointer;text-align:left}.pname span{font-weight:500}.pname:hover{text-decoration:underline}
.pcr{display:flex;gap:6px;align-items:center}.psw{flex:1;position:relative}.pls{padding:6px 9px}
.ib{width:30px;height:30px;border-radius:6px;border:0;color:#fff;font-weight:700;cursor:pointer;font-size:15px}.ib.add{background:#3f7d58}.ib.rm{background:#3c7a89}
.cmg{display:flex;flex-direction:column;gap:12px;margin-top:10px}.cms{border:1px solid var(--line);border-radius:8px;padding:10px}.cmh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:8px}
.cform3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.span2{grid-column:span 2}.span3{grid-column:1/-1}
.sech{cursor:pointer;user-select:none;margin:0!important}.card.sec:not(.shut) .sech{margin-bottom:12px!important}.tg2{display:inline-block;width:16px;color:var(--mut);font-weight:700}.card.sec.shut{padding:10px 16px}
.tkfb{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 0;align-items:center}.fchip.sm{padding:3px 9px;font-size:12px}.tkfb .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.fl{font-size:12px;border:0;background:none;padding:0 1px;cursor:default}.fl.em{cursor:pointer}.fl.em:hover{transform:scale(1.2)}
.btn.tg.on{background:#eef4ff;border-color:#b2ccff;color:#3538cd}.chipe{font-size:12px;background:#f2f4f7;border-radius:99px;padding:2px 4px 2px 9px;display:inline-flex;gap:4px;align-items:center}.chipe button{border:0;background:none;cursor:pointer;color:var(--mut)}
/* summary v2 (compact, printable) */
.sum{font-family:Inter,Arial,sans-serif;color:#1d2330;max-width:820px;background:#fff;padding:22px 24px;border:1px solid #e4e7ec;border-radius:10px;font-size:12px}
.sum .sh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #B3202A;padding-bottom:8px;margin-bottom:4px}
.sum h1{font-size:18px;margin:0}.sum .it{font-style:italic;font-size:13px}.sum .addr{font-size:13px;color:#344054}.sum .mls{font-size:11px;color:#667085}.sum .gen{font-size:10px;color:#98a2b3;text-align:right}
.sum .ss{margin-top:8px;break-inside:avoid}
.sum .bar{background:#B3202A;color:#fff;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;display:flex;align-items:center;gap:6px}
.sum .tog{border:0;background:rgba(255,255,255,.2);color:#fff;width:16px;height:16px;border-radius:3px;font-weight:700;line-height:14px;cursor:pointer;padding:0;font-size:13px}
.sum .sedit{margin-left:auto;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:10px;border-radius:3px;padding:1px 6px;cursor:pointer;text-transform:none;letter-spacing:0}
.sum table{width:100%;border-collapse:collapse;background:#f4f5f7}.sum th,.sum td{padding:2px 8px;border-bottom:1px solid #e4e7ec;text-align:left;font-size:11.5px;vertical-align:top;line-height:1.35}
.sum table.kv th{width:38%;font-weight:700;white-space:nowrap}.sum table.dt td:first-child{font-weight:700}.sum table.dt td.dd{width:90px;text-align:right;font-variant-numeric:tabular-nums}
.sum tr.waived td{text-decoration:line-through;color:#98a2b3}
.sum .two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.sum .sub{font-weight:700;font-size:11.5px;padding:3px 8px;background:#e8e9ec}
.sum ul{margin:0;padding:4px 10px 4px 26px;background:#f4f5f7;font-size:11.5px}.sum .txt{background:#f4f5f7;padding:4px 8px;white-space:pre-wrap;font-size:11.5px;line-height:1.4}.sum .txt.b{font-weight:700}.sum .mut2{font-weight:400;color:#475467}
.sum .clk{cursor:pointer}.sum .clk:hover{outline:2px solid #fda29b;outline-offset:-2px}
.sum .disc{font-size:9px;color:#98a2b3;margin-top:10px;text-transform:uppercase;letter-spacing:.02em}
.sum.print{border:0;border-radius:0;max-width:none;padding:0}
/* summary */
@media (max-width:860px){.layout,.split{grid-template-columns:1fr}.ck{grid-template-columns:20px 1fr 32px}.ck input[type=date],.ck .st{grid-column:2}.sum .two{grid-template-columns:1fr}}

html,body{overflow-x:clip;-webkit-text-size-adjust:100%}
.tabs,.scroll{overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}.plook,.gores{overscroll-behavior:contain}
.tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}

.seg.big button{padding:7px 14px;font-weight:600}
.tkg{padding:0;overflow:hidden;margin-bottom:12px}
.tkgh{padding:10px 14px;background:#f9fafb;border-bottom:1px solid var(--line)}
.tkp{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:10px 14px;border-bottom:1px solid #f2f4f7}
.tkp:last-child{border-bottom:0}.tkp input{margin-top:2px}
.tkp.done .tkt{text-decoration:line-through;color:#98a2b3}
.tkt{font-weight:500}.tkr{text-align:right}
.tkd{border:0;background:none;padding:0;margin-top:2px;font:inherit;font-size:12.5px;color:#1849a9;cursor:pointer;text-align:left}
